name: Weekly digest to GitHub Pages

on:
  schedule:
    # 13:25 UTC every Monday. The run covers the previous Monday-Sunday week.
    - cron: "25 13 * * 1"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Optional backfill start date, YYYY-MM-DD"
        required: false
        type: string
      end_date:
        description: "Optional backfill end date, YYYY-MM-DD"
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and archive weekly digests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          # No SendGrid / SMTP secrets needed anymore. We publish instead of emailing.
        run: |
          set +e
          failed=0
          start_date="${{ github.event.inputs.start_date }}"
          end_date="${{ github.event.inputs.end_date }}"
          configs=(
            config_physics.yaml
            config_quantum.yaml
          )

          mkdir -p docs/digests

          if [ -n "${start_date}" ] || [ -n "${end_date}" ]; then
            if [ -z "${start_date}" ] || [ -z "${end_date}" ]; then
              echo "For a backfill, set both start_date and end_date."
              exit 1
            fi
            mapfile -t target_ranges < <(python - <<PY
          from datetime import date
          start = date.fromisoformat("${start_date}")
          end = date.fromisoformat("${end_date}")
          if end < start:
              raise SystemExit("end_date must be on or after start_date")
          print(f"{start.isoformat()} {end.isoformat()}")
          PY
          )
          else
            mapfile -t target_ranges < <(python - <<'PY'
          from datetime import datetime, timedelta, timezone
          today = datetime.now(timezone.utc).date()
          this_monday = today - timedelta(days=today.weekday())
          previous_monday = this_monday - timedelta(days=7)
          previous_sunday = this_monday - timedelta(days=1)
          print(f"{previous_monday.isoformat()} {previous_sunday.isoformat()}")
          PY
          )
          fi

          for target_range in "${target_ranges[@]}"; do
            read -r start end <<< "${target_range}"
            for cfg in "${configs[@]}"; do
              label="${cfg#config_}"
              label="${label%.yaml}"
              dest="docs/digests/${start}_${label}.html"

              echo "Generating ${cfg} for ${start} through ${end} -> ${dest}"
              if python src/action.py --config "${cfg}" --start-date "${start}" --end-date "${end}"; then
                cp digest.html "${dest}"
              else
                failed=1
                cat > "${dest}" <<EOF
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><title>Digest failed</title></head>
          <body>
          <h1>Digest generation failed</h1>
          <p><b>Config:</b> ${cfg}</p>
          <p><b>Date range:</b> ${start} through ${end}</p>
          <p>See the GitHub Actions logs for the full error.</p>
          </body>
          </html>
          EOF
              fi
            done
          done

          if [ "${failed}" -ne 0 ]; then
            touch .digest_generation_failed
          fi

      - name: Rebuild index and stats
        if: always()
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python src/build_site.py

      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-digests
          path: |
            docs/index.html
            docs/digests/*.html
          if-no-files-found: warn

      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Publish weekly digest $(date -u +%F)" || echo "Nothing to commit"
          git push

      - name: Fail if any digest failed
        if: always()
        run: |
          if [ -f .digest_generation_failed ]; then
            echo "One or more digest configs failed. Any successful digests were still published."
            exit 1
          fi
